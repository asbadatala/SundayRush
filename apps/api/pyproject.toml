[project]
name = "sundayrush-api"
version = "0.1.0"
description = "SundayRush fantasy football game-day companion API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "rapidfuzz>=3.14.6",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.47",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["alembic/", "tests/fixtures/"]
